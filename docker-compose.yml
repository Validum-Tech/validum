services:
  validum-api:
    build:
      context: .
      dockerfile: validum-api/Dockerfile
    image: validum-api:latest
    container_name: validum-api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - VALIDUM_BIK_FILE=/app/data/ED807.xml
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - validum-net

networks:
  validum-net:
    driver: bridge
