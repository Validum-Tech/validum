name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # ручной запуск из UI

concurrency:
  # Отменяет предыдущий запуск на той же ветке — экономим минуты
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Проверка Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Coverage summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Покрытие (jacoco, строки)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for module in validum-core validum-api validum-cli; do
            csv="$module/build/reports/jacoco/test/jacocoTestReport.csv"
            if [ -f "$csv" ]; then
              missed=$(awk -F, 'NR>1{m+=$8} END{print m+0}' "$csv")
              covered=$(awk -F, 'NR>1{c+=$9} END{print c+0}' "$csv")
              total=$((missed + covered))
              if [ "$total" -gt 0 ]; then
                pct=$(awk -v c="$covered" -v t="$total" 'BEGIN{printf "%.1f", 100*c/t}')
                echo "- \`$module\`: **$pct%** ($covered из $total строк)" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      - name: Test summary
        if: always()
        run: |
          echo "## Результаты тестов" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for module in validum-core validum-api validum-cli validum-allure; do
            dir="$module/build/test-results/test"
            if [ -d "$dir" ]; then
              total=$(grep -h 'tests=' "$dir"/*.xml 2>/dev/null | sed -E 's/.*tests="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s+0}')
              failures=$(grep -h 'failures=' "$dir"/*.xml 2>/dev/null | sed -E 's/.*failures="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s+0}')
              errors=$(grep -h 'errors=' "$dir"/*.xml 2>/dev/null | sed -E 's/.*errors="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s+0}')
              skipped=$(grep -h 'skipped=' "$dir"/*.xml 2>/dev/null | sed -E 's/.*skipped="([0-9]+)".*/\1/' | awk '{s+=$1} END {print s+0}')
              echo "- \`$module\`: **$total** тестов, $failures failures, $errors errors, $skipped skipped" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            validum-core/build/reports/tests/test/
            validum-api/build/reports/tests/test/
            validum-cli/build/reports/tests/test/
            validum-core/build/reports/problems/
            validum-api/build/reports/problems/
            validum-core/build/reports/jacoco/test/html/
            validum-api/build/reports/jacoco/test/html/
            validum-cli/build/reports/jacoco/test/html/
          retention-days: 14
          if-no-files-found: warn

      - name: Build fat jar
        run: ./gradlew :validum-cli:shadowJar --no-daemon

      - name: Smoke-тест собранного jar
        run: java -jar validum-cli/build/libs/validum.jar version

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: validum-jar-${{ github.run_number }}
          path: validum-cli/build/libs/validum.jar
          retention-days: 30
          if-no-files-found: error

  windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      # Ловит проблемы с окончаниями строк и путями, которых не видно на Linux
      - name: Build and test
        run: .\gradlew.bat build --no-daemon


  tree-guard:
    name: Публичное дерево
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Публичный репозиторий не должен содержать внутренние материалы
      # (AGENTS.md, docs/internal, docs/reference, tools, seed.sql) и ссылки на них.
      - name: Запрещённые пути и ссылки
        run: |
          bad=$(git ls-files | grep -E '^(AGENTS\.md|test\.ps1|seed\.sql|docs/internal/|docs/reference/|tools/|data/|\.idea/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::В публичном дереве появились внутренние файлы:"
            echo "$bad"
            exit 1
          fi
          refs=$(git grep -nE 'docs/internal|docs/reference|open-reports\.ps1|AGENTS\.md' -- '*.md' '*.java' '*.kts' || true)
          if [ -n "$refs" ]; then
            echo "::error::Ссылки на внутренние файлы:"
            echo "$refs"
            exit 1
          fi
          echo "Публичное дерево чистое: внутренних файлов и ссылок нет."
