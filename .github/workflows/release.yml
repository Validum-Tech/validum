name: Release

# Запуск: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v0.2.0)"
        required: true

permissions:
  contents: write   # создание GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Секреты Central Portal видны шагам через env. Пустая строка = секрет не задан,
    # и шаг публикации в Maven Central пропускается (релиз всё равно соберётся).
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Проверка Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Определить версию
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Ревизия: $TAG (версия $VERSION)"

      - name: Сборка и тесты
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pversion="$VERSION" --no-daemon

      # Публикация в Maven Central: только когда заданы токен и PGP-ключ.
      # artifactId: validum-core и validum-allure (см. корневой build.gradle.kts).
      - name: Публикация в Maven Central
        if: env.CENTRAL_USERNAME != '' && env.SIGNING_KEY != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          ./gradlew publishToMavenCentral -Pversion="$VERSION" \
            --no-daemon --no-configuration-cache

      - name: Подготовить артефакты релиза
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp validum-cli/build/libs/validum.jar "dist/validum-${VERSION}.jar"
          sha256sum "dist/validum-${VERSION}.jar" > "dist/validum-${VERSION}.jar.sha256"
          ls -lh dist

      - name: Smoke-тест jar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          java -jar "dist/validum-${VERSION}.jar" version

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="$(awk '/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then NOTES="Validum $VERSION — см. CHANGELOG.md"; fi
          gh release create "$TAG" \
            "dist/validum-${VERSION}.jar" \
            "dist/validum-${VERSION}.jar.sha256" \
            --title "Validum $VERSION" \
            --notes "$NOTES"
