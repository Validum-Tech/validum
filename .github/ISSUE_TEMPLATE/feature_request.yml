name: Идея или фича
description: Чего не хватает в Validum
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите **задачу**, а не решение: что вы пытаетесь сделать и что мешает.
        Решение может оказаться проще, чем кажется.

  - type: textarea
    id: task
    attributes:
      label: Задача
      description: Какую проблему тестирования вы решаете?
      placeholder: "Нужно залить 10 000 клиентов в тестовую PostgreSQL вместе с документами"
    validations:
      required: true

  - type: textarea
    id: now
    attributes:
      label: Как выкручиваетесь сейчас
      description: Ручные скрипты, другой инструмент, терпите — что именно

  - type: textarea
    id: idea
    attributes:
      label: Как это могло бы выглядеть
      description: Команда, эндпоинт, поле в CSV — на ваш вкус. Необязательно.

  - type: dropdown
    id: impact
    attributes:
      label: Насколько это блокирует
      options:
        - Без этого не начну пользоваться
        - Сильно мешает, есть обход
        - Приятное улучшение
    validations:
      required: true
